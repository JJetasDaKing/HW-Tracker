<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coursework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F6FB;
    --surface: #FFFFFF;
    --surface-2: #FBFBFE;
    --text: #16161F;
    --text-2: #6C6C80;
    --text-3: #9B9BAC;
    --border: #E7E7F1;
    --border-strong: #D6D6E6;
    --accent: #5B5BD6;
    --accent-hover: #4949BE;
    --accent-bg: #EFEFFC;
    --danger: #E5484D;
    --danger-bg: #FDEDED;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 1px 2px rgba(20,20,40,0.04), 0 8px 24px rgba(20,20,40,0.06);
    --shadow-hover: 0 4px 8px rgba(20,20,40,0.05), 0 16px 32px rgba(20,20,40,0.09);
    --shadow-focus: 0 0 0 3px rgba(91,91,214,0.22);
  }
  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 980px; margin:0 auto; padding: 0 1.5rem 5rem; }

  /* Header */
  header{ padding: 3.5rem 0 2rem; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:600; letter-spacing:0.02em;
    color: var(--accent); background: var(--accent-bg);
    padding: 5px 12px; border-radius: 999px; margin-bottom: 1rem;
  }
  h1{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size: clamp(28px, 4.5vw, 38px);
    letter-spacing:-0.02em;
    margin: 0 0 0.5rem;
  }
  header p{ color: var(--text-2); font-size:15.5px; max-width:520px; margin:0; line-height:1.6; }

  /* Stats row */
  .stats{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin: 2rem 0 2.5rem; }
  .stat{
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-md); padding: 1rem 1.1rem;
  }
  .stat-num{ font-family:'Sora', sans-serif; font-weight:700; font-size:24px; letter-spacing:-0.01em; }
  .stat-label{ font-size:12.5px; color: var(--text-2); margin-top:2px; }

  /* Form card */
  .new-card{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 1.75rem;
    margin-bottom: 2.25rem;
  }
  .new-card h2{ font-family:'Sora', sans-serif; font-size:16px; font-weight:600; margin:0 0 1.25rem; }
  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:14px; }
  .field{ margin-bottom:14px; }
  label{
    display:block; font-size:13px; font-weight:500; color: var(--text-2);
    margin-bottom:6px;
  }
  input[type="text"], input[type="date"], textarea{
    width:100%; font-family:'Inter', sans-serif; font-size:14.5px; color:var(--text);
    background: var(--surface-2); border:1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding:10px 12px; transition: box-shadow .12s ease, border-color .12s ease;
  }
  textarea{ min-height:78px; resize:vertical; line-height:1.55; font-family:'Inter',sans-serif; }
  input:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:none; border-color: var(--accent); box-shadow: var(--shadow-focus);
  }
  .error-msg{ display:none; font-size:13px; color: var(--danger); margin: -4px 0 12px; font-weight:500; }

  button.primary{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Inter', sans-serif; font-size:14px; font-weight:600;
    background: var(--accent); color:#fff; border:none;
    border-radius: var(--radius-sm); padding: 11px 18px; cursor:pointer;
    transition: background .12s ease, transform .08s ease;
  }
  button.primary:hover{ background: var(--accent-hover); }
  button.primary:active{ transform: scale(0.98); }

  /* Controls */
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:1.1rem; }
  .search-wrap{ position:relative; flex:1; min-width:220px; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-3); }
  .search-wrap input{ padding-left:36px; background:var(--surface); }

  .tabs-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.75rem; }
  .subject-tab{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Inter', sans-serif; font-size:13px; font-weight:500;
    padding: 7px 14px; border-radius:999px; border:1px solid var(--border-strong);
    background: var(--surface); color: var(--text-2); cursor:pointer;
    transition: all .12s ease;
  }
  .subject-tab .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-3); }
  .subject-tab.active{ background: var(--text); color:#fff; border-color: var(--text); }
  .subject-tab.active .dot{ background:#fff; }
  .subject-tab:hover:not(.active){ border-color: var(--text-2); color: var(--text); }

  /* Entry grid */
  #entries{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:14px; }
  .card{
    position:relative;
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.25rem 1.3rem 1.1rem;
    box-shadow: var(--shadow-card);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card::before{
    content:''; position:absolute; left:0; top:1.1rem; bottom:1.1rem; width:3px;
    border-radius: 3px; background: var(--dot, var(--accent));
  }
  .card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; padding-left:6px; }
  .card-subject{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Sora', sans-serif; font-weight:600; font-size:14.5px; margin:0 0 3px;
  }
  .card-subject .dot{ width:7px; height:7px; border-radius:50%; background: var(--dot, var(--accent)); flex-shrink:0; }
  .card-date{ font-size:12px; color: var(--text-3); font-weight:500; }
  .card-section{ padding-left:6px; margin-bottom:9px; }
  .card-section:last-of-type{ margin-bottom:0; }
  .card-label{ font-size:11px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color: var(--text-3); margin:0 0 3px; }
  .card-text{ font-size:14px; line-height:1.55; margin:0; white-space:pre-wrap; color: var(--text); }
  .card-actions{ display:flex; justify-content:flex-end; margin-top:10px; padding-left:6px; }
  .btn-del{
    display:inline-flex; align-items:center; gap:5px;
    background:none; border:none; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500;
    color: var(--text-3); cursor:pointer; padding:4px 6px; border-radius:6px;
  }
  .btn-del:hover{ color: var(--danger); background: var(--danger-bg); }

  .empty{ grid-column:1/-1; text-align:center; padding: 3.5rem 1rem; color: var(--text-2); font-size:14.5px; }
  .empty svg{ margin-bottom:12px; color: var(--text-3); }

  footer{ text-align:center; margin-top:3rem; font-size:12.5px; color: var(--text-3); }

  @media (max-width:560px){
    .field-row{ grid-template-columns:1fr; }
    .stats{ grid-template-columns: 1fr 1fr; }
    .stats .stat:last-child{ grid-column: span 2; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">Personal · private to this device</span>
    <h1>HW Tracker</h1>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total entries</div></div>
    <div class="stat"><div class="stat-num" id="stat-subjects">0</div><div class="stat-label">Subjects tracked</div></div>
    <div class="stat"><div class="stat-num" id="stat-week">0</div><div class="stat-label">Added this week</div></div>
  </div>

  <div class="new-card">
    <h2>New entry</h2>
    <div class="field-row">
      <div class="field">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-subject">Subject / class</label>
        <input type="text" id="f-subject" placeholder="e.g. Organic Chemistry">
      </div>
    </div>
    <div class="field">
      <label for="f-homework">Homework</label>
      <textarea id="f-homework" placeholder="What's due, and when"></textarea>
    </div>
    <div class="field">
      <label for="f-notes">Notes</label>
      <textarea id="f-notes" placeholder="Key points from class"></textarea>
    </div>
    <p class="error-msg" id="f-error"></p>
    <button class="primary" id="btn-add">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add entry
    </button>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="f-search" placeholder="Search homework, notes, or subject">
    </div>
  </div>
  <div class="tabs-row" id="subject-tabs"></div>

  <div id="entries"></div>
</div>

<footer>Saved only in this browser, on this device.</footer>

<script>
(function(){
  const STORAGE_KEY = 'coursework-catalog-entries';
  const COLORS = ['#7C6FF0','#14B8A6','#F97066','#F5A524','#3B82F6','#EC4899'];
  let entries = [];
  let activeSubject = '';

  const dateEl = document.getElementById('f-date');
  const subjectEl = document.getElementById('f-subject');
  const hwEl = document.getElementById('f-homework');
  const notesEl = document.getElementById('f-notes');
  const errEl = document.getElementById('f-error');
  const searchEl = document.getElementById('f-search');
  const tabsEl = document.getElementById('subject-tabs');
  const entriesEl = document.getElementById('entries');
  const statTotal = document.getElementById('stat-total');
  const statSubjects = document.getElementById('stat-subjects');
  const statWeek = document.getElementById('stat-week');

  dateEl.value = new Date().toISOString().slice(0,10);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }
  function colorForSubject(subject){
    let hash = 0;
    for (let i=0;i<subject.length;i++){ hash = (hash*31 + subject.charCodeAt(i)) % 997; }
    return COLORS[Math.abs(hash) % COLORS.length];
  }
  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
    } catch(e){ entries = []; }
  }
  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch(e){ console.error('Could not save to local storage', e); }
  }

  function renderStats(){
    statTotal.textContent = entries.length;
    statSubjects.textContent = new Set(entries.map(e => e.subject)).size;
    const weekAgo = Date.now() - 7*24*60*60*1000;
    statWeek.textContent = entries.filter(e => new Date(e.date + 'T00:00:00').getTime() >= weekAgo).length;
  }

  function renderTabs(){
    const subjects = [...new Set(entries.map(e => e.subject))].sort();
    if (activeSubject && !subjects.includes(activeSubject)) activeSubject = '';
    let html = `<button class="subject-tab ${activeSubject==='' ? 'active':''}" data-subject="">All subjects</button>`;
    subjects.forEach(s => {
      html += `<button class="subject-tab ${activeSubject===s ? 'active':''}" data-subject="${escapeHtml(s)}" style="--dot:${colorForSubject(s)}"><span class="dot" style="background:${colorForSubject(s)}"></span>${escapeHtml(s)}</button>`;
    });
    tabsEl.innerHTML = html;
    tabsEl.querySelectorAll('.subject-tab').forEach(btn => {
      btn.addEventListener('click', () => { activeSubject = btn.getAttribute('data-subject'); render(); });
    });
  }

  function render(){
    renderStats();
    renderTabs();
    const q = searchEl.value.trim().toLowerCase();
    let list = [...entries].sort((a,b) => b.date.localeCompare(a.date));
    list = list.filter(e => {
      if (activeSubject && e.subject !== activeSubject) return false;
      if (!q) return true;
      return e.subject.toLowerCase().includes(q) || (e.homework||'').toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q);
    });

    if (list.length === 0){
      entriesEl.innerHTML = `<div class="empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="14" x2="14" y2="14"/></svg><br>
        ${entries.length === 0 ? 'No entries yet. Add your first class day above.' : 'Nothing matches. Try a different search or subject.'}
      </div>`;
      return;
    }

    entriesEl.innerHTML = list.map(e => { const color = colorForSubject(e.subject); return `
      <div class="card" style="--dot:${color}">
        <div class="card-head">
          <div>
            <p class="card-subject"><span class="dot" style="background:${color}"></span>${escapeHtml(e.subject)}</p>
            <p class="card-date">${fmtDate(e.date)}</p>
          </div>
        </div>
        ${e.homework ? `<div class="card-section"><p class="card-label">Homework</p><p class="card-text">${escapeHtml(e.homework)}</p></div>` : ''}
        ${e.notes ? `<div class="card-section"><p class="card-label">Notes</p><p class="card-text">${escapeHtml(e.notes)}</p></div>` : ''}
        <div class="card-actions">
          <button class="btn-del" data-id="${e.id}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            Delete
          </button>
        </div>
      </div>
    `; }).join('');

    entriesEl.querySelectorAll('.btn-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        entries = entries.filter(e => e.id !== id);
        save(); render();
      });
    });
  }

  document.getElementById('btn-add').addEventListener('click', () => {
    const date = dateEl.value;
    const subject = subjectEl.value.trim();
    const homework = hwEl.value.trim();
    const notes = notesEl.value.trim();

    if (!date || !subject){ errEl.textContent = 'Enter a date and subject first.'; errEl.style.display = 'block'; return; }
    if (!homework && !notes){ errEl.textContent = 'Add homework or notes before saving.'; errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';

    entries.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,7), date, subject, homework, notes });
    save();
    subjectEl.value = ''; hwEl.value = ''; notesEl.value = '';
    render();
  });

  [dateEl, subjectEl].forEach(el => el.addEventListener('input', () => { errEl.style.display = 'none'; }));
  searchEl.addEventListener('input', render);

  load();
  render();
})();
</script>

</body>
</html>
